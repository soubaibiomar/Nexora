# ExpertLink - AI & Big Data Platform
# Docker Compose for full infrastructure

services:
  # ── Neo4j Graph Database ──────────────────────────────────────────
  neo4j:
    image: neo4j:5.15
    container_name: expertlink-neo4j
    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/expertlink2024
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - expertlink-net

  # ── Elasticsearch (Document Search & Analytics) ──────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: expertlink-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - expertlink-net

  # ── Kafka (Event Streaming) ──────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: expertlink-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - expertlink-net

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: expertlink-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - expertlink-net

  # ── Apache Spark ────────────────────────────────────────────────
  spark-master:
    image: bitnami/spark:3.5
    container_name: expertlink-spark-master
    ports:
      - "8080:8080" # Spark UI
      - "7077:7077" # Master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
    volumes:
      - ./backend/spark:/opt/spark-jobs
      - ./data:/opt/spark-data
    networks:
      - expertlink-net

  spark-worker:
    image: bitnami/spark:3.5
    container_name: expertlink-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    volumes:
      - ./backend/spark:/opt/spark-jobs
      - ./data:/opt/spark-data
    networks:
      - expertlink-net

  # ── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: expertlink-backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: expertlink2024
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on:
      - neo4j
      - elasticsearch
      - kafka
    volumes:
      - ./data:/app/data
    networks:
      - expertlink-net

  # ── React Frontend ──────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: expertlink-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - expertlink-net

volumes:
  neo4j_data:
  neo4j_logs:
  es_data:

networks:
  expertlink-net:
    driver: bridge
